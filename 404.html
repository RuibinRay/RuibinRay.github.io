<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost among the stars — Ruibin Jin Yao</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Fraunces'; src: url('/assets/fonts/fraunces-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Fraunces'; src: url('/assets/fonts/fraunces-var-italic.woff2') format('woff2'); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: 'Instrument Sans'; src: url('/assets/fonts/instrument-sans-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    :root { --ivory: #f3eadb; --gold: #f2c14e; --abyss: #050a2e; color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: var(--abyss); color: var(--ivory); }
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box;
      background: linear-gradient(rgba(5, 10, 46, .55), rgba(5, 10, 46, .8)), url('/assets/painting/painting-1280.jpg') center 30% / cover no-repeat; }
    h1 { font: 340 clamp(2.4rem, 8vw, 5rem)/1 'Fraunces', Georgia, serif; margin: 0 0 14px; font-variation-settings: 'opsz' 144, 'SOFT' 100; text-shadow: 0 2px 30px rgba(3, 8, 40, .8); }
    p { font: italic 320 clamp(1.1rem, 2.6vw, 1.5rem)/1.4 'Fraunces', Georgia, serif; color: #f3e3a8; margin: 0 0 30px; text-shadow: 0 1px 16px rgba(3, 8, 40, .9); }
    a { font: 500 .78rem/1 'Instrument Sans', Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ivory); text-decoration: none; padding: 10px 0; border-bottom: 1px solid var(--gold); }
    a:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Lost among the stars</h1>
    <p>This page doesn’t exist — but the sky is still here.</p>
    <a href="/">Back to the painting</a>
  </main>
</body>
</html>
