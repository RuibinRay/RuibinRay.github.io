<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruibin Jin Yao — Beyond the Frame</title>
  <meta name="description" content="The portfolio of Ruibin (Ray) Jin Yao has moved to ruibinray.github.io/Profile.">
  <meta name="theme-color" content="#050a2e">
  <link rel="canonical" href="https://ruibinray.github.io/Profile/">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!--
    This address now sends visitors to the new portfolio (the RuibinRay/Profile repository).
    The query and the part after # travel with them, so old links such as
    /#projects/vrfb-info or /#world/CHN open the same thing on the new site.
    The previous home page is in this repository's history: revert this commit to bring it back.
  -->
  <script>
    (function () {
      var moved = { '#constellation': '#contact' };   // the one section that changed its name
      var hash = location.hash || '';
      location.replace('/Profile/' + location.search + (moved[hash] || hash));
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/Profile/"></noscript>

  <style>
    html, body { margin: 0; min-height: 100%; background: #050a2e; color: #f6ecd4; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; font: 400 1.125rem/1.5 Georgia, 'Times New Roman', serif; }
    h1 { margin: 0 0 12px; font-weight: 500; font-size: clamp(2.25rem, 8vw, 4.5rem); line-height: 1; letter-spacing: -.02em; }
    p { margin: 0 0 28px; color: #f3e3a8; font-style: italic; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #f6c443; color: #050a2e; font: 600 1rem/1 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f6ecd4; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Ruibin Jin Yao</h1>
    <p>My portfolio has moved to a new address.</p>
    <a href="/Profile/">Open the portfolio</a>
  </main>
</body>
</html>
